[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "bharatasr"
version = "0.1.0"
description = "Open-source ASR benchmarking for Indian languages."
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
  "typer>=0.12",
  "rich>=13.7",
  "soundfile>=0.12",
  "numpy>=1.26",
  "jiwer>=3.0",
]

[project.optional-dependencies]
whisper = ["faster-whisper>=1.0.0", "ctranslate2>=4.0.0", "av>=11,<18"]
sravaani = ["torch>=2.2", "transformers>=4.40", "soundfile>=0.12", "sentencepiece>=0.2"]
dev = ["pytest>=8", "ruff>=0.5"]

[project.scripts]
bharatasr = "bharatasr.cli:app"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
